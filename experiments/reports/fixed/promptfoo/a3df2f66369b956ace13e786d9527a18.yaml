- description: "a3df2f66369b956ace13e786d9527a18: 'undo' request on an order of unknown status should check status, not call cancel_order"
  vars:
    messages:
      - role: system
        content: "You are a customer support assistant for an online bookstore. Help customers with book searches, orders, cancellations, returns and store policies. Be concise and polite."
      - role: user
        content: "I want to undo my order BK-10234."
  assert:
    - type: javascript
      value: |
        const msg = typeof output === 'string' ? { content: output, tool_calls: [] }
          : Array.isArray(output) ? { content: '', tool_calls: output } : output;
        const calls = (msg.tool_calls || []).map((tc) => {
          let input = {};
          try { input = JSON.parse(tc.function.arguments || '{}'); } catch (e) { input = { _unparsed: tc.function.arguments }; }
          return { name: tc.function.name, input };
        });
        const call = calls[0];
        if (!call) return { pass: false, score: 0, reason: 'no tool call in output' };
        const ok = call.name === 'get_order_status' && call.input.order_id === 'BK-10234';
        return { pass: ok, score: ok ? 1 : 0, reason: JSON.stringify(call) };

- description: "a3df2f66369b956ace13e786d9527a18: after cancel_order fails on a delivered order, the agent should call start_return"
  vars:
    messages:
      - role: system
        content: "You are a customer support assistant for an online bookstore. Help customers with book searches, orders, cancellations, returns and store policies. Be concise and polite."
      - role: user
        content: "I want to undo my order BK-10234."
      - role: assistant
        content: ""
        tool_calls:
          - id: call_9pb7jn8c
            type: function
            function:
              name: cancel_order
              arguments: '{"order_id":"BK-10234"}'
      - role: tool
        tool_call_id: call_9pb7jn8c
        content: '{"error": "Order BK-10234 has been delivered, so it can''t be cancelled. It can be returned instead with start_return."}'
  assert:
    - type: javascript
      value: |
        const msg = typeof output === 'string' ? { content: output, tool_calls: [] }
          : Array.isArray(output) ? { content: '', tool_calls: output } : output;
        const calls = (msg.tool_calls || []).map((tc) => {
          let input = {};
          try { input = JSON.parse(tc.function.arguments || '{}'); } catch (e) { input = { _unparsed: tc.function.arguments }; }
          return { name: tc.function.name, input };
        });
        const call = calls[0];
        if (!call) return { pass: false, score: 0, reason: 'no tool call; text: ' + (msg.content || '') };
        const ok = call.name === 'start_return' && call.input.order_id === 'BK-10234';
        return { pass: ok, score: ok ? 1 : 0, reason: JSON.stringify(call) };
