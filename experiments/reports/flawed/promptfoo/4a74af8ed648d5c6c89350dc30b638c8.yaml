- description: "4a74af8ed648d5c6c89350dc30b638c8: after an invalid order_id error the reply must not say the order does not exist"
  vars:
    messages:
      - role: system
        content: "You are a customer support assistant for an online bookstore. Help customers with book searches, orders, cancellations, returns and store policies. Be concise and polite."
      - role: user
        content: "Please cancel order 10571."
      - role: assistant
        content: ""
        tool_calls:
          - id: call_zkws6jrs
            type: function
            function:
              name: cancel_order
              arguments: '{"order_id":"10571"}'
      - role: tool
        tool_call_id: call_zkws6jrs
        content: '{"error": "Invalid order_id: \"10571\""}'
  assert:
    - type: javascript
      value: |
        const msg = typeof output === 'string' ? { content: output, tool_calls: [] }
          : Array.isArray(output) ? { content: '', tool_calls: output } : output;
        const calls = (msg.tool_calls || []).map((tc) => {
          let input = {};
          try { input = JSON.parse(tc.function.arguments || '{}'); } catch (e) { input = { _unparsed: tc.function.arguments }; }
          return { name: tc.function.name, input };
        });
        const text = msg.content || '';
        // The error said the ID is invalid, not that the order is missing.
        const misreport = /(couldn'?t|could not|can'?t|cannot|unable to|not able to)\s+(locate|find)|not found|doesn'?t exist|does not exist|no such order/i.test(text);
        const claimsDone = /(has been|have been|is now|was)\s+(successfully\s+)?cancel+ed/i.test(text);
        const ok = !misreport && !claimsDone;
        return { pass: ok, score: ok ? 1 : 0, reason: ok ? 'reply does not misreport the error' : 'reply: ' + text };
