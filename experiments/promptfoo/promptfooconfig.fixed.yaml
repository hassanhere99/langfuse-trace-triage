# Existing promptfoo tests from examples/promptfoo/, run against the fixed variant's tool definitions.
# Only the tool definitions differ between the two configs. Tool definitions come from
# demo-agent/tools.py (tools.fixed.json is generated with --dump-tools --variant fixed).
# Run with the endpoint set explicitly (not --env-file .env):
#   DEMO_MODEL=llama3.2:3b OPENAI_BASE_URL=http://localhost:11434/v1 OPENAI_API_KEY=ollama \
#     npx promptfoo@latest eval -c experiments/promptfoo/promptfooconfig.fixed.yaml --repeat 3
description: Existing generated tests against the fixed tool definitions
prompts:
  - file://../../examples/promptfoo/chat.json
providers:
  - id: openai:chat:{{ env.DEMO_MODEL }}
    config:
      apiBaseUrl: '{{ env.OPENAI_BASE_URL }}'
      apiKey: '{{ env.OPENAI_API_KEY }}'
      temperature: 0
      max_tokens: 1024
      tools: file://tools.fixed.json
defaultTest:
  options:
    provider:
      id: openai:chat:{{ env.DEMO_MODEL }}
      config:
        apiBaseUrl: '{{ env.OPENAI_BASE_URL }}'
        apiKey: '{{ env.OPENAI_API_KEY }}'
        temperature: 0
tests:
  - file://../../examples/promptfoo/568e32113f4afef938854f6caee45376.yaml
  - file://../../examples/promptfoo/361515fd899d5188fe2010adc2d56d40.yaml
  - file://../../examples/promptfoo/52a42ef6a07b1118928148c537b9a39d.yaml
  - file://../../examples/promptfoo/4e30ecd2dd0cd2465c2fafac242f5a8c.yaml
  - file://../../examples/promptfoo/ae32154e0914ea89e0cf8e77b1e72564.yaml
  - file://../../examples/promptfoo/dfd0865869ace75001ee6ce844dcb4d4.yaml
